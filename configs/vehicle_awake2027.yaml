steering:
  max_angle_deg: 28.0
  rate_deg_s: 90.0
  deadband_deg: 0.5
  backlash_deg: 0.5
  latency_ms: 18.0

motor:
  # 13.5T sensored brushless, approximately 3000-3500 KV class with 2S.
  max_torque_nm: 0.2
  max_rpm: 14000.0
  gear_ratio: 5.0
  current_limit_a: 60.0
  torque_lag_ms: 12.0

battery:
  cells: 2
  nominal_voltage_v: 7.4
  capacity_mah: 5000.0
  internal_resistance_ohm: 0.035

tires:
  friction_front: 1.15
  friction_rear: 1.05
  rolling_resistance: 0.015

suspension:
  stiffness: 30.0
  damping: 3.0
  max_travel_m: 0.015

aero:
  drag_coefficient: 0.7
  frontal_area_m2: 0.018

limits:
  max_length_m: 0.45
  max_width_m: 0.2
  max_height_m: 0.2
  min_ground_clearance_m: 0.005
