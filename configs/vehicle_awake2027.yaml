name: awake_2027_reference_car
description: >
  Reference AWAKE 2027 1/10 4WD touring car digital twin. One sensored brushless motor,
  VESC, Ackermann steering, Raspberry Pi 5, LD19 lidar, four ultrasonic sensors, BNO085
  IMU, rear-wheel encoders.
scale: 0.1

dimensions:
  length_m: 0.376
  width_m: 0.182
  height_m: 0.14
  ground_clearance_m: 0.005

mass_kg: 2.25
center_of_mass_m:
  - 0.005
  - 0.0
  - 0.038
wheelbase_m: 0.257
track_width_m: 0.185
wheel_radius_m: 0.035
wheel_width_m: 0.028
wheel_mass_kg: 0.05
wheel_offset_z_m: -0.055
drive: 4wd

# Body parts in the vehicle frame (x forward, y left, z up). Keep the collision
# footprint inside the 45 x 20 x 20 cm competition envelope.
structure:
  - name: lower_deck
    shape: box
    position_m:
      - 0.0
      - 0.0
      - -0.053
    rpy_deg:
      - 0.0
      - 0.0
      - 0.0
    size_m:
      - 0.299
      - 0.153
      - 0.014
    color: '#20262c'
    opacity: 1.0
    visible: true
    collision: true
  - name: main_body
    shape: box
    position_m:
      - 0.0
      - 0.0
      - -0.018
    rpy_deg:
      - 0.0
      - 0.0
      - 0.0
    size_m:
      - 0.347
      - 0.182
      - 0.040
    color: '#2b5f78'
    opacity: 1.0
    visible: true
    collision: true
  - name: electronics_tray
    shape: box
    position_m:
      - -0.048
      - 0.0
      - 0.007
    rpy_deg:
      - 0.0
      - 0.0
      - 0.0
    size_m:
      - 0.141
      - 0.153
      - 0.014
    color: '#1a1f24'
    opacity: 1.0
    visible: true
    collision: false
  - name: cabin
    shape: box
    position_m:
      - -0.057
      - 0.0
      - 0.020
    rpy_deg:
      - 0.0
      - 0.0
      - 0.0
    size_m:
      - 0.132
      - 0.128
      - 0.025
    color: '#171c21'
    opacity: 1.0
    visible: true
    collision: false
  - name: sensor_mast
    shape: cylinder
    position_m:
      - 0.105
      - 0.0
      - 0.034
    rpy_deg:
      - 0.0
      - 0.0
      - 0.0
    size_m:
      - 0.018
      - 0.018
      - 0.031
    color: '#3a4148'
    opacity: 1.0
    visible: true
    collision: false
  - name: front_bumper
    shape: box
    position_m:
      - 0.180
      - 0.0
      - -0.036
    rpy_deg:
      - 0.0
      - 0.0
      - 0.0
    size_m:
      - 0.016
      - 0.174
      - 0.027
    color: '#1f2429'
    opacity: 1.0
    visible: true
    collision: true
  - name: rear_bumper
    shape: box
    position_m:
      - -0.180
      - 0.0
      - -0.036
    rpy_deg:
      - 0.0
      - 0.0
      - 0.0
    size_m:
      - 0.016
      - 0.174
      - 0.027
    color: '#1f2429'
    opacity: 1.0
    visible: true
    collision: true
  - name: wing
    shape: box
    position_m:
      - -0.167
      - 0.0
      - 0.027
    rpy_deg:
      - 0.0
      - 0.0
      - 0.0
    size_m:
      - 0.026
