name: test_track_baseline
description: Baseline scenario on the PDF-like test track.
track: configs/tracks/test_track.yaml
vehicle: configs/vehicles/generic_1_10_4wd.yaml
sensors: configs/sensors/ld06.yaml

seed: 42
realism: realistic
localization: gt
controller: manual

race:
  laps: 5
  wall_deformation_impulse_threshold: 0.35

simulation:
  physics_hz: 240
  control_hz: 50
  telemetry_hz: 30
  realtime_factor: 1.0

odometry:
  speed_scale_error: 0.02
  yaw_scale_error: 0.01
  speed_bias_mps: 0.0
  yaw_bias_deg_s: 0.20
  yaw_bias_walk_deg_s_sqrt_s: 0.01
  speed_noise_mps: 0.02
  yaw_noise_rad_s: 0.005

recording:
  enabled: true
  save_scans: true
